name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate deterministic smoke dataset
        run: python -m src.data.simulate_events --users 1000 --days 60 --seed 42 --output /tmp/events.csv

      - name: Run unit and analytics tests
        run: python -m pytest -q

      - name: Run A/B significance smoke check
        run: |
          python - <<'PY'
          import pandas as pd
          from src.metrics.ab_testing import activation_experiment_from_events
          result = activation_experiment_from_events(pd.read_csv('/tmp/events.csv', parse_dates=['event_timestamp']))
          assert 0 <= result['p_value'] <= 1
          assert result['control_users'] > 0 and result['treatment_users'] > 0
          print(result)
          PY

      - name: Build CI report
        run: python -m scripts.build_ci_report --input /tmp/events.csv --output /tmp/growth_report.txt

      - name: Publish report to job summary
        if: always()
        run: |
          echo '## Growth Funnel Lab CI report' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/growth_report.txt ]; then cat /tmp/growth_report.txt >> "$GITHUB_STEP_SUMMARY"; else echo 'Report unavailable because an earlier step failed.' >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Send successful CI report to Telegram
        if: ${{ success() && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          text = Path('/tmp/growth_report.txt').read_text(encoding='utf-8')
          payload = urllib.parse.urlencode({
              'chat_id': os.environ['TELEGRAM_CHAT_ID'],
              'text': text,
          }).encode()
          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          with urllib.request.urlopen(urllib.request.Request(url, data=payload), timeout=20) as response:
              result = json.loads(response.read())
          if not result.get('ok'):
              raise RuntimeError(result)
          print('Telegram report sent')
          PY

      - name: Send critical cohort anomaly alert to Telegram
        if: ${{ success() && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        continue-on-error: true
        env:
          EVENTS_PATH: /tmp/events.csv
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.send_critical_anomaly_alert
